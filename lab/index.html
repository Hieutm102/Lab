<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Student Management System</h1>
        <p>Manage and analyze student information</p>
      </header>

      <!-- Add Student -->
      <section class="card">
        <h2>Add New Student</h2>

        <form id="studentForm" novalidate>
          <div class="form-group">
            <label for="name">Student Name</label>
            <input
              type="text"
              id="name"
              placeholder="Enter student name"
              maxlength="50"
              autocomplete="off"
            />
            <small class="error-message" id="nameError"></small>
          </div>

          <div class="form-group">
            <label for="className">Class</label>
            <input
              type="text"
              id="className"
              placeholder="Example: Web1"
              maxlength="20"
              autocomplete="off"
            />
            <small class="error-message" id="classError"></small>
          </div>

          <div class="form-group">
            <label for="score">Score</label>
            <input
              type="number"
              id="score"
              placeholder="Enter score (0-10)"
              min="0"
              max="10"
              step="0.1"
            />
            <small class="error-message" id="scoreError"></small>
          </div>

          <button type="submit" class="btn primary">Add Student</button>

          <p
            id="formMessage"
            class="form-message"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>

      <!-- Statistics -->
      <section class="statistics">
        <div class="stat-card">
          <h3>Total Students</h3>
          <p id="totalStudents">0</p>
        </div>

        <div class="stat-card">
          <h3>Average Score</h3>
          <p id="averageScore">0</p>
        </div>

        <div class="stat-card">
          <h3>Highest Score</h3>
          <p id="highestScore">0</p>
        </div>
      </section>

      <!-- Student Table -->
      <section class="card">
        <h2>Student List</h2>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>No.</th>
                <th>Name</th>
                <th>Class</th>
                <th>Score</th>
                <th>Classification</th>
              </tr>
            </thead>

            <tbody id="studentTable"></tbody>
          </table>
        </div>
      </section>

      <!-- Functions -->
      <section class="card">
        <h2>Array Processing Functions</h2>

        <div class="function-buttons">
          <button class="btn" id="showNames">Sort Student Names</button>

          <button class="btn" id="groupStudents">Group By Class</button>

          <button class="btn" id="showTop">Show Top Students</button>
        </div>

        <div class="top-input">
          <label for="topNumber">Number of top students:</label>

          <input type="number" id="topNumber" value="3" min="1" step="1" />

          <small class="error-message" id="topError"></small>
        </div>

        <div id="result" class="result">
          <p>Select a function to see its result.</p>
        </div>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
